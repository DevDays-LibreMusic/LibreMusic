services:
  music:
    build:
      context: ..
      dockerfile: server/Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    init: true
    volumes:
      - music-data:/data
      - ./private:/etc/music/private:ro
      - ./imports:/imports:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    stop_grace_period: 30s

  gateway:
    image: nginx:1.28-alpine
    user: "10001:10001"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      - music
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - music-data:/data:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  music-data:
