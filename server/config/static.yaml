components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 2
    fs-task-processor:
      worker_threads: 8
  default_task_processor: main-task-processor
  components:
    server:
      listener:
        port: 8080
        task_processor: main-task-processor
    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: warning
          overflow_behavior: discard
    process-starter:
      task_processor: main-task-processor
    music-service: {}
    music-health:
      path: /health
      method: GET
      task_processor: fs-task-processor
      max_request_size: 16384
      max_requests_in_flight: 64
      max_requests_per_second: 100
      request_body_size_log_limit: 0
      response_data_size_log_limit: 0
    music-login:
      path: /v1/auth/login
      method: POST
      task_processor: fs-task-processor
      max_request_size: 16384
      max_requests_in_flight: 4
      max_requests_per_second: 5
      request_body_size_log_limit: 0
      response_data_size_log_limit: 0
    music-refresh:
      path: /v1/auth/refresh
      method: POST
      task_processor: fs-task-processor
      max_request_size: 16384
      max_requests_in_flight: 64
      max_requests_per_second: 100
